# Dish taxonomy used to generate synthetic menus and to seed query understanding.
#
# cuisines.<key>:
#   aliases:          query phrasings that mean this cuisine
#   yelp_categories:  Yelp category strings that map a business to this cuisine
#   dishes: one flow mapping per dish:
#     name      canonical dish name (normalised, lower case)
#     variants  alternative names/spellings seen on menus and in queries
#     diet      veg | vegan | non_veg | egg          (vegan dishes are also veg)
#     meal      meal-time profile (see meal_profiles) or an explicit
#               {breakfast, lunch, snack, dinner, late_night} distribution
#     price     [low, high] USD at price tier 2
#     prep      minutes
#     tags      descriptors/ingredients (feed BM25, embeddings and vague queries)
#     gf        true if typically gluten free
#
# Descriptions are generated from tags by dishcovery/data/menus.py.

meal_profiles:
  main:      {lunch: 0.45, dinner: 0.45, late_night: 0.05, snack: 0.05}
  lunch:     {lunch: 0.6, dinner: 0.3, snack: 0.1}
  dinner:    {dinner: 0.65, lunch: 0.25, late_night: 0.1}
  breakfast: {breakfast: 0.8, lunch: 0.15, snack: 0.05}
  brunch:    {breakfast: 0.5, lunch: 0.4, snack: 0.1}
  snack:     {snack: 0.5, lunch: 0.2, dinner: 0.15, late_night: 0.15}
  dessert:   {snack: 0.45, dinner: 0.35, lunch: 0.1, late_night: 0.1}
  drink:     {breakfast: 0.25, snack: 0.35, lunch: 0.2, dinner: 0.1, late_night: 0.1}
  late:      {dinner: 0.4, late_night: 0.4, snack: 0.2}
  side:      {lunch: 0.4, dinner: 0.45, snack: 0.1, late_night: 0.05}

generic_dishes:
  - {name: french fries, variants: [fries, chips], diet: vegan, meal: side, price: [3, 5], prep: 8, tags: [potato, fried, crispy, side], gf: true}
  - {name: soft drink, variants: [soda, coke, pop], diet: vegan, meal: drink, price: [2, 3], prep: 1, tags: [drink, cold], gf: true}
  - {name: bottled water, variants: [water], diet: vegan, meal: drink, price: [1, 2], prep: 1, tags: [drink], gf: true}
  - {name: side salad, variants: [house salad, garden salad], diet: vegan, meal: side, price: [4, 7], prep: 5, tags: [salad, healthy, light, fresh], gf: true}
  - {name: iced tea, variants: [sweet tea], diet: vegan, meal: drink, price: [2, 4], prep: 2, tags: [drink, cold], gf: true}

