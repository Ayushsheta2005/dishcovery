# Curated synonym groups for query expansion.
#
# Each group is {terms: [...], weight: 0.0-1.0 (default 1.0), type: ...}.
#   * Every term in a group expands to every other term of the group with the
#     group's weight (multiplied by QUConfig.synonym_weight at query time).
#   * Terms are normalised with dishcovery.qu.text.normalize, so "mac & cheese"
#     and "Mac 'n' Cheese" are fine; multi-word terms are allowed.
#   * Expansion is NOT transitive across groups. Near-synonyms (e.g. naan vs
#     kulcha) live in their own lower-weight group rather than being merged
#     into an exact-synonym group.
#   * type: ingredient | dish | cuisine | drink | general. Terms of
#     ingredient groups are also registered as ingredient entities in the
#     lexicon gazetteer and are never spell-"corrected".

