[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dishcovery"
version = "0.1.0"
description = "Multi-stage retrieval and ranking for geo-constrained food search: C++ index + HNSW + H3, LambdaMART, measured against Elasticsearch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "scikit-learn>=1.0",
  "pyyaml>=6",
  "orjson>=3.8",
  "aiohttp>=3.8",
  "h3>=4.0",
  "matplotlib>=3.5",
]

[project.optional-dependencies]
ltr = ["lightgbm>=4.0"]
embed = ["sentence-transformers>=2.2", "torch>=2.0"]
fast = ["uvloop>=0.17"]
dev = ["pytest>=7"]
full = ["lightgbm>=4.0", "sentence-transformers>=2.2", "torch>=2.0", "uvloop>=0.17", "pytest>=7"]

[project.scripts]
dishcovery = "dishcovery.cli:main"

[tool.setuptools.packages.find]
include = ["dishcovery*"]

[tool.setuptools.package-data]
dishcovery = ["data/taxonomy.yaml", "qu/synonyms.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
