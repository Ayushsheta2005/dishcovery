name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDC_NATIVE=OFF
          cmake --build build -j"$(nproc)"
      - name: C++ unit tests
        run: ./build/core/dishcovery_tests
      - name: Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt lightgbm
      - name: Python unit tests
        run: .venv/bin/python -m pytest -q
      - name: End-to-end smoke (synthetic data)
        run: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: work/smoke/results/
